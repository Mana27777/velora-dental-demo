<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="anatomy-title anatomy-desc">
<title id="anatomy-title">Esquema educativo de una pieza ausente y su restauración ilustrativa</title>
<desc id="anatomy-desc">Dos dientes vecinos, encía rosa y hueso. En el espacio central se pueden mostrar un implante, su conexión y una corona. No representa anatomía clínica exacta.</desc>
<defs>
<linearGradient id="ceramic" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#DCCFBA"/><stop offset=".3" stop-color="#FFFEF8"/><stop offset=".62" stop-color="#F7F0E3"/><stop offset="1" stop-color="#CABBA5"/></linearGradient>
<linearGradient id="titanium"><stop stop-color="#686966"/><stop offset=".22" stop-color="#BBBAB4"/><stop offset=".44" stop-color="#E1E0D9"/><stop offset=".7" stop-color="#999B96"/><stop offset="1" stop-color="#555854"/></linearGradient>
<linearGradient id="gum" x2="0" y2="1"><stop stop-color="#EFC3C9"/><stop offset="1" stop-color="#BB7D89"/></linearGradient>
<linearGradient id="bone" x2="0" y2="1"><stop stop-color="#EBDECA"/><stop offset="1" stop-color="#CBB89D"/></linearGradient>
<filter id="soft-depth" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#77564A" flood-opacity=".15"/></filter>
<pattern id="bone-lines" width="32" height="28" patternUnits="userSpaceOnUse"><path d="m4 18 9-8 12 5M13 10l-2-7" fill="none" stroke="#BCA38E" stroke-width="2" opacity=".45"/></pattern>
<style>svg>path:first-of-type{fill:url(#bone)}svg>path:nth-of-type(3){fill:url(#gum)}svg>g[fill="#FCF8EF"]{fill:url(#ceramic);filter:url(#soft-depth)}.anatomy-implant>path:first-child,.anatomy-implant>path:last-child{fill:url(#titanium)}.anatomy-crown{fill:url(#ceramic);filter:url(#soft-depth)}</style>
</defs>
